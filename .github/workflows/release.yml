name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release archive
        shell: pwsh
        run: ./build/Build-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhotoImporter-v${{ env.RELEASE_VERSION }}-win
          path: |
            artifacts/release/PhotoImporter-v${{ env.RELEASE_VERSION }}-win.zip
            artifacts/release/PhotoImporter-v${{ env.RELEASE_VERSION }}-win.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "artifacts/release/PhotoImporter-v$env:RELEASE_VERSION-win.zip"
          $checksum = "$archive.sha256"
          $notes = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME, $archive, $checksum,
            '--verify-tag',
            '--title', "Photo Importer $env:GITHUB_REF_NAME"
          )
          if (Test-Path -LiteralPath $notes) {
            $arguments += @('--notes-file', $notes)
          } else {
            $arguments += '--generate-notes'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
